services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reminder-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - reminder-net

networks:
  reminder-net:
    driver: bridge
